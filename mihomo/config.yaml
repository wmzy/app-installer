
proxies:
  - name: "直连"
    type: direct
    udp: true

mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

geodata-mode: true
# GeoIP/GeoSite 数据库自动更新(此前 11 个月没更新, 新增国内域名会误走代理)
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

find-process-mode: strict
global-client-fingerprint: chrome

# ppg 机场节点域名(*.kunlun05dns.com)只能由其私有 DNS 解析, 公共 DNS 无记录;
# 作为 proxy-provider 加载时订阅内的 dns 段被丢弃, 因此 hosts 由 config.sh
# 动态注入 (数据源: ~/.mihomo/config/ppg-hosts.txt, 由 ppg-dns-update.sh 每 30 分钟刷新)
# 手动刷新: ~/.mihomo/bin/ppg-dns-update.sh

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-groups:
  - name: 默认
    type: select
    proxies:
      [自动选择fallback, 自动选择, 直连, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点]

  - name: AI
    type: select
    proxies:
      [自动选择ai, 台湾, 日本, 新加坡, 美国, 其它地区]

  - name: Google
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: Telegram
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: Twitter
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: 哔哩哔哩
    type: select
    proxies:
      [直连, 默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择]

  - name: 巴哈姆特
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: YouTube
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: NETFLIX
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: Spotify
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  - name: Github
    type: url-test
    # 用 robots.txt 而不是 api.github.com: 后者消耗出口 IP 的未认证 API 配额(60次/时),
    # 节点会被自己的健康检查打到 403 限频, 真实 API 请求(gh/git)跟着全部失败
    url: "https://github.com/robots.txt"
    # lazy: false 常驻探测, 避免 Github 组空闲后用过期延迟数据选中已死节点
    # max-failed-times 3: 3 次拨号失败立即触发健康检查切换(默认 5, 且要求失败落在 5s 窗口内)
    interval: 120
    lazy: false
    max-failed-times: 3
    include-all: true
    exclude-type: direct
    tolerance: 150

  - name: 国内
    type: select
    proxies:
      [直连, 默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择]

  - name: 其他
    type: select
    proxies:
      [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]

  #分隔,下面是地区分组
  - name: 香港
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)港|hk|hongkong|hong kong"
    tolerance: 150

  - name: 台湾
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)台|tw|taiwan"
    tolerance: 150

  - name: 日本
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)日|jp|japan"
    tolerance: 150

  - name: 美国
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)美|\\busa?\\b|united ?states|🇺🇸"
    tolerance: 150

  - name: 新加坡
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)新加坡|狮城|\\bsg\\b|singapore|🇸🇬"
    tolerance: 150

  - name: 其它地区
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|港|hk|hongkong|台|tw|taiwan|日|jp|japan|新加坡|狮城|\\bsg\\b|singapore|美|\\busa?\\b|united ?states)).*"
    tolerance: 150

  - name: 全部节点
    type: url-test
    include-all: true
    exclude-type: direct
    tolerance: 150

  - name: 自动选择
    type: url-test
    include-all: true
    exclude-type: direct
    tolerance: 150

  - name: 自动选择fallback
    type: fallback
    proxies:
      - 自动选择[0]
      - 自动选择[1]
    url: 'https://www.gstatic.com/generate_204'
    interval: 300

  - name: 自动选择[0]
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "^\\[0].*"
    tolerance: 150

  - name: 自动选择[1]
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "^\\[1].*"
    tolerance: 150

  - name: 自动选择ai
    type: url-test
    # url: "https://claude.ai"
    url: "https://api2.cursor.sh"
    interval: 300
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:🇭🇰|港|hk|hongkong|官网)).*"
    tolerance: 150

rules:
  - GEOIP,lan,直连,no-resolve
  - RULE-SET,ai_domain,AI
  - GEOSITE,github,Github
  - GEOSITE,twitter,Twitter
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,Google
  - GEOSITE,telegram,Telegram
  - GEOSITE,netflix,NETFLIX
  - GEOSITE,bilibili,哔哩哔哩
  - GEOSITE,bahamut,巴哈姆特
  - GEOSITE,spotify,Spotify
  # Apple 国内有 CDN/云上贵州, 直连更快且省节点流量(此前 38.5 万条连接走了代理)
  # 如需代理 Apple News 等服务, 在 metacubexd 里把"国内"组切到代理即可
  - GEOSITE,apple,国内
  - GEOSITE,CN,国内
  - GEOSITE,geolocation-!cn,其他

  - GEOIP,google,Google
  - GEOIP,netflix,NETFLIX
  - GEOIP,telegram,Telegram
  - GEOIP,twitter,Twitter
  - GEOIP,CN,国内
  - MATCH,其他

rule-providers:
  ai_domain: 
    type: inline
    behavior: classical
    # https://gist.github.com/sarices/017da597ae6b28063bbdd52693d78385
    # https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Clash/Claude
    payload:
      - DOMAIN,cdn.usefathom.com
      - DOMAIN-SUFFIX,anthropic.com
      - DOMAIN-SUFFIX,claude.ai
      - DOMAIN-SUFFIX,claude.com
      - DOMAIN-SUFFIX,forefront.ai
      - DOMAIN-SUFFIX,claudeusercontent.com
      - DOMAIN-SUFFIX,generativelanguage.googleapis.com
      - DOMAIN-SUFFIX,bard.google.com
      - DOMAIN-SUFFIX,cursor.sh
      - DOMAIN-SUFFIX,openai.com
      - DOMAIN-SUFFIX,chatgpt.com
      - DOMAIN-SUFFIX,ai.google.dev
      - DOMAIN-SUFFIX,aistudio.google.com
      - DOMAIN-SUFFIX,tokenharbor.ai
      - DOMAIN-SUFFIX,muse.ai
